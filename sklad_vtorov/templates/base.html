<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Складской учёт{% endblock %}</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:#f3f6fb;color:#1d2939}
header{background:#172b4d;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}
header a{color:white;text-decoration:none;margin-left:16px}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}
h1{margin-top:0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 10px #152b4d12}
.num{font-size:28px;font-weight:bold;color:#2457a7;margin-top:8px}
table{width:100%;border-collapse:collapse;background:white;margin-top:12px}th,td{padding:11px;border-bottom:1px solid #e6eaf0;text-align:left}
.btn{display:inline-block;background:#2457a7;color:white;padding:10px 14px;border-radius:7px;text-decoration:none}
.muted{color:#667085}.warn{color:#b54708}
</style></head><body>
<header><strong>Складской учёт</strong><nav><a href="/">Главная</a><a href="/admin/">Администрирование</a><a href="/catalog/api/products/">API товаров</a>{% if user.is_authenticated %}<a href="/accounts/logout/">Выйти</a>{% endif %}</nav></header>
<main class="wrap">{% block content %}{% endblock %}</main></body></html>
